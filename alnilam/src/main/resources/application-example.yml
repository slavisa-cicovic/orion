spring:
  application:
    name: alnilam
  datasource:
    url: jdbc:postgresql://localhost:5432/orion
    username: orion
    password: orion
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 300MB
      max-request-size: 300MB

security:
  jwt:
    issuer: orion-alnilam
    secret: change-me-change-me-change-me-change-me
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30

app:
  cors:
    allowed-origins:
      - "https://example-web.orion.com"
      - "https://example-mobile.orion.com"
      - "http://localhost:3000"
      - "http://localhost:8081"
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    exposed-headers: []
    allow-credentials: true
    max-age: 3600
  upload:
    dir: /path/to/upload-dir
