spring:
  application:
    name: alnilam
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${DB_USERNAME:orion_app}
    password: ${DB_PASSWORD:orionPassword123!}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

security:
  jwt:
    issuer: ${JWT_ISSUER:orion-alnilam}
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}
