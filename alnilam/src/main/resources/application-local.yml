spring:
  application:
    name: alnilam
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orion}
    username: ${DB_USERNAME:orion_app}
    password: ${DB_PASSWORD:orionPassword123!}
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    issuer: ${JWT_ISSUER:orion-alnilam}
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:30}

app:
  cors:
    allowed-origins:
      - "http://localhost:3000"
      - "https://app.orion.com"
      - "https://staging.orion.com"
      - "http://localhost:8081" # Expo web
      - "http://192.168.10.148:8081" # LAN IP
      - "http://192.168.10.148:8080" # Expo client
    allowed-methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "OPTIONS"
    allowed-headers:
      - "*"
    exposed-headers: []
    allow-credentials: true
    max-age: 3600
